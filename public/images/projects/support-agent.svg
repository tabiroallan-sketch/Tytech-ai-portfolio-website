<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750">
  <defs>
    <linearGradient id="hdr2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c28f55" stop-opacity=".22"/>
      <stop offset="1" stop-color="#c29a60" stop-opacity=".04"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="#0e0d0b"/>
  <rect width="1200" height="56" fill="#151310"/>
  <circle cx="28" cy="28" r="7" fill="#f87171" opacity=".7"/>
  <circle cx="52" cy="28" r="7" fill="#c9934e" opacity=".7"/>
  <circle cx="76" cy="28" r="7" fill="#c28f55" opacity=".8"/>
  <rect x="480" y="16" width="240" height="24" rx="12" fill="#ffffff" opacity=".06"/>
  <text x="600" y="32" font-family="monospace" font-size="12" fill="#9ca3af" text-anchor="middle">support-agent · live chat</text>

  <!-- chat panel -->
  <rect x="140" y="100" width="620" height="560" rx="24" fill="#171412" stroke="#ffffff" stroke-opacity=".09"/>
  <line x1="140" y1="176" x2="760" y2="176" stroke="#ffffff" stroke-opacity=".07"/>
  <circle cx="188" cy="138" r="20" fill="#2b2114"/>
  <path d="M180 138 q4 -8 12 -4 q4 2 3 8 l-3 6 h-10 z" fill="#c28f55"/>
  <text x="222" y="134" font-family="sans-serif" font-weight="bold" font-size="14" fill="#f1f5f9">Acme Support Agent</text>
  <circle cx="382" cy="130" r="4" fill="#c28f55"/>
  <text x="392" y="134" font-family="sans-serif" font-size="11" fill="#c28f55">online — answers instantly</text>

  <!-- user bubble -->
  <g font-family="sans-serif" font-size="13">
    <rect x="430" y="204" width="270" height="46" rx="16" fill="#c28f55" fill-opacity=".14" stroke="#c28f55" stroke-opacity=".35"/>
    <text x="450" y="232" fill="#f0e6d5">Do you ship internationally?</text>
    <!-- agent bubble -->
    <rect x="170" y="272" width="420" height="96" rx="16" fill="#1d1916" stroke="#ffffff" stroke-opacity=".08"/>
    <text x="192" y="300" fill="#e2e8f0">Yes! We ship to 40+ countries. EU orders</text>
    <text x="192" y="320" fill="#e2e8f0">arrive in 3–5 days, US in 5–7. Shipping is</text>
    <text x="192" y="340" fill="#e2e8f0">free over $75. 📦 Sources: shipping-policy.md</text>
    <!-- user bubble -->
    <rect x="452" y="390" width="250" height="46" rx="16" fill="#c28f55" fill-opacity=".14" stroke="#c28f55" stroke-opacity=".35"/>
    <text x="472" y="418" fill="#f0e6d5">What's your refund policy?</text>
    <!-- agent bubble -->
    <rect x="170" y="458" width="430" height="76" rx="16" fill="#1d1916" stroke="#ffffff" stroke-opacity=".08"/>
    <text x="192" y="486" fill="#e2e8f0">You can return any item within 30 days for a</text>
    <text x="192" y="506" fill="#e2e8f0">full refund. Want me to start a return for you?</text>
    <!-- typing -->
    <rect x="170" y="556" width="90" height="40" rx="14" fill="#1d1916" stroke="#ffffff" stroke-opacity=".08"/>
    <circle cx="196" cy="576" r="4" fill="#c28f55"><animate attributeName="opacity" values="1;.3;1" dur="1s" repeatCount="indefinite"/></circle>
    <circle cx="214" cy="576" r="4" fill="#c28f55"><animate attributeName="opacity" values=".3;1;.3" dur="1s" repeatCount="indefinite"/></circle>
    <circle cx="232" cy="576" r="4" fill="#c28f55"><animate attributeName="opacity" values="1;.3;1" dur="1s" repeatCount="indefinite"/></circle>
    <rect x="170" y="616" width="560" height="30" rx="15" fill="#1a1614" stroke="#ffffff" stroke-opacity=".08"/>
    <text x="190" y="636" fill="#4b5563" font-size="12">Ask anything…</text>
    <circle cx="702" cy="631" r="11" fill="#c28f55"/>
    <path d="M697 631 l8 0 m-3 -4 l4 4 l-4 4" stroke="#0a0a0a" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- right analytics rail -->
  <g font-family="sans-serif">
    <rect x="800" y="100" width="280" height="268" rx="20" fill="#171412" stroke="#ffffff" stroke-opacity=".09"/>
    <text x="828" y="136" font-size="12" fill="#6b7280" letter-spacing="1">RESOLVED BY AI</text>
    <text x="828" y="186" font-weight="bold" font-size="34" fill="#c28f55">72%</text>
    <rect x="828" y="210" width="224" height="10" rx="5" fill="#1f2937"/>
    <rect x="828" y="210" width="161" height="10" rx="5" fill="#c28f55"/>
    <text x="828" y="252" font-size="12" fill="#9ca3af">Escalated to humans:</text>
    <text x="1010" y="252" font-size="12" fill="#e2e8f0" text-anchor="end">6 today</text>
    <text x="828" y="280" font-size="12" fill="#9ca3af">Median response:</text>
    <text x="1010" y="280" font-size="12" fill="#c28f55" text-anchor="end">2.4 sec</text>
    <text x="828" y="308" font-size="12" fill="#9ca3af">Knowledge gaps found:</text>
    <text x="1010" y="308" font-size="12" fill="#c29a60" text-anchor="end">2 new</text>

    <rect x="800" y="392" width="280" height="268" rx="20" fill="#171412" stroke="#ffffff" stroke-opacity=".09"/>
    <text x="828" y="428" font-size="12" fill="#6b7280" letter-spacing="1">TOP QUESTIONS</text>
    <g transform="translate(828,452)" font-size="12">
      <rect width="224" height="30" rx="8" fill="#ffffff" fill-opacity=".04"/><text x="12" y="19" fill="#cbd5e1">Refund policy</text><text x="212" y="19" fill="#6b7280" text-anchor="end">41</text>
      <rect y="38" width="224" height="30" rx="8" fill="#ffffff" fill-opacity=".04"/><text x="12" y="57" fill="#cbd5e1">Shipping times</text><text x="212" y="57" fill="#6b7280" text-anchor="end">33</text>
      <rect y="76" width="224" height="30" rx="8" fill="#ffffff" fill-opacity=".04"/><text x="12" y="95" fill="#cbd5e1">Order status</text><text x="212" y="95" fill="#6b7280" text-anchor="end">27</text>
      <rect y="114" width="224" height="30" rx="8" fill="#ffffff" fill-opacity=".04"/><text x="12" y="133" fill="#cbd5e1">Password reset</text><text x="212" y="133" fill="#6b7280" text-anchor="end">18</text>
    </g>
    <text x="828" y="632" font-size="11" fill="#c28f55">✓ Grounded in company docs only</text>
    <text x="828" y="650" font-size="11" fill="#c28f55">✓ Human handoff on low confidence</text>
  </g>
</svg>
