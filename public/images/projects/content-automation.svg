<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750">
  <defs>
    <linearGradient id="cont" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c28f55" stop-opacity=".16"/>
      <stop offset="1" stop-color="#c29a60" stop-opacity=".05"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="#0e0d0b"/>
  <rect width="1200" height="56" fill="#151310"/>
  <circle cx="28" cy="28" r="7" fill="#f87171" opacity=".7"/>
  <circle cx="52" cy="28" r="7" fill="#c9934e" opacity=".7"/>
  <circle cx="76" cy="28" r="7" fill="#c28f55" opacity=".8"/>
  <rect x="480" y="16" width="240" height="24" rx="12" fill="#ffffff" opacity=".06"/>
  <text x="600" y="32" font-family="monospace" font-size="12" fill="#9ca3af" text-anchor="middle">content-automation · Claude + Notion</text>

  <!-- brief input -->
  <g font-family="sans-serif">
    <rect x="80" y="104" width="300" height="240" rx="20" fill="#171412" stroke="#c28f55" stroke-opacity=".35"/>
    <text x="106" y="140" font-size="11" fill="#6b7280" letter-spacing="1.5">CAMPAIGN BRIEF (NOTION)</text>
    <text x="106" y="170" font-weight="bold" font-size="15" fill="#f1f5f9">Autumn Product Launch</text>
    <g font-size="12">
      <text x="106" y="204" fill="#9ca3af">Goal:</text><text x="150" y="204" fill="#cbd5e1">Pre-orders from existing users</text>
      <text x="106" y="228" fill="#9ca3af">Audience:</text><text x="182" y="228" fill="#cbd5e1">Design teams, agencies</text>
      <text x="106" y="252" fill="#9ca3af">Key message:</text><text x="196" y="252" fill="#cbd5e1">Ship 10× faster together</text>
    </g>
    <rect x="106" y="280" width="248" height="36" rx="10" fill="#2b2114" stroke="#c28f55" stroke-opacity=".4"/>
    <text x="230" y="303" font-size="12.5" fill="#d3b084" text-anchor="middle" font-weight="bold">✓ Brief saved → n8n triggered</text>

    <!-- style context -->
    <rect x="80" y="372" width="300 " height="130" rx="20" fill="#171412" stroke="#ffffff" stroke-opacity=".09"/>
    <text x="106" y="408" font-size="11" fill="#6b7280" letter-spacing="1.5">STYLE CONTEXT INJECTED</text>
    <g font-size="12">
      <text x="106" y="438" fill="#c28f55">✓ Brand voice guide v3</text>
      <text x="106" y="462" fill="#c28f55">✓ 2 top-performing past posts</text>
      <text x="106" y="486" fill="#c28f55">✓ Platform conventions (LinkedIn/X)</text>
    </g>
  </g>

  <!-- arrow -->
  <path d="M395 224 h40" stroke="#c28f55" stroke-width="2" stroke-dasharray="6 5"><animate attributeName="stroke-dashoffset" values="11;0" dur=".9s" repeatCount="indefinite"/></path>

  <!-- AI generation -->
  <g font-family="sans-serif">
    <rect x="450" y="150" width="260" height="180" rx="20" fill="#1a1614" stroke="#c29a60" stroke-opacity=".45"/>
    <text x="474" y="186" font-size="11" fill="#6b7280" letter-spacing="1.5">AI DRAFTING (CLAUDE)</text>
    <text x="474" y="216" font-size="13" fill="#e5d2af">Generating per-channel drafts…</text>
    <rect x="474" y="236" width="212" height="8" rx="4" fill="#1f2937"/>
    <rect x="474" y="236" width="150" height="8" rx="4" fill="#c29a60"><animate attributeName="width" values="30;212;30" dur="2.6s" repeatCount="indefinite"/></rect>
    <g font-size="12">
      <text x="474" y="272" fill="#c28f55">✓ LinkedIn post — 142 words</text>
      <text x="474" y="296" fill="#c28f55">✓ X thread — 5 tweets</text>
      <text x="474" y="320" fill="#c28f55">✓ Newsletter section — 210 words</text>
    </g>

    <!-- review board -->
    <rect x="450" y="360" width="670" height="330" rx="20" fill="#171412" stroke="#ffffff" stroke-opacity=".09"/>
    <text x="474" y="396" font-size="11" fill="#6b7280" letter-spacing="1.5">REVIEW BOARD — NOTHING PUBLISHES WITHOUT APPROVAL</text>
    <!-- columns -->
    <g transform="translate(474,420)" font-size="12">
      <text fill="#e2e8f0" font-weight="bold">📝 Drafts (3)</text>
      <rect width="200" height="110" rx="12" fill="#1d1916" stroke="#ffffff" stroke-opacity=".08"/>
      <text x="14" y="28" fill="#cbd5e1">LinkedIn — launch story</text><text x="14" y="48" fill="#6b7280" font-size="11">Hook: "Your design team…"</text>
      <rect x="14" y="66" width="70" height="24" rx="12" fill="#352a1a"/><text x="49" y="82" fill="#e5d2af" font-size="10.5" text-anchor="middle">Approve ✓</text>
      <rect x="92" y="66" width="60" height="24" rx="12" fill="#292524"/><text x="122" y="82" fill="#d6d3d1" font-size="10.5" text-anchor="middle">Edit</text>

      <rect x="220" width="200" height="110" rx="12" fill="#1d1916" stroke="#ffffff" stroke-opacity=".08"/>
      <text x="234" y="28" fill="#cbd5e1">X thread — 5 posts</text><text x="234" y="48" fill="#6b7280" font-size="11">Feature-by-feature angle</text>
      <rect x="234" y="66" width="70" height="24" rx="12" fill="#352a1a"/><text x="269" y="82" fill="#e5d2af" font-size="10.5" text-anchor="middle">Approve ✓</text>
      <rect x="312" y="66" width="60" height="24" rx="12" fill="#292524"/><text x="342" y="82" fill="#d6d3d1" font-size="10.5" text-anchor="middle">Edit</text>

      <rect x="440" width="200" height="110" rx="12" fill="#1d1916" stroke="#ffffff" stroke-opacity=".08"/>
      <text x="454" y="28" fill="#cbd5e1">Newsletter section</text><text x="454" y="48" fill="#6b7280" font-size="11">CTA: early-access link</text>
      <rect x="454" y="66" width="70" height="24" rx="12" fill="#352a1a"/><text x="489" y="82" fill="#e5d2af" font-size="10.5" text-anchor="middle">Approve ✓</text>

      <text x="672" y="-16" fill="#e2e8f0" font-weight="bold">📅 Approved → Buffer</text>
      <rect x="672" width="176" height="110" rx="12" fill="#33281a" stroke="#c29a60" stroke-opacity=".35"/>
      <text x="686" y="28" fill="#e5d2af">Mon 09:00 LinkedIn</text>
      <text x="686" y="52" fill="#e5d2af">Tue 12:30 X thread</text>
      <text x="686" y="76" fill="#e5d2af">Thu 08:00 Newsletter</text>
      <text x="686" y="98" fill="#d3b084" font-size="11">auto-scheduled ✓</text>
    </g>
  </g>
  <rect width="1200" height="750" fill="url(#cont)" opacity=".05"/>
</svg>
