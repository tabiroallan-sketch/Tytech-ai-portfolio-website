<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750">
  <defs>
    <linearGradient id="inv" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c28f55" stop-opacity=".16"/>
      <stop offset="1" stop-color="#c29a60" stop-opacity=".04"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="#0e0d0b"/>
  <rect width="1200" height="56" fill="#151310"/>
  <circle cx="28" cy="28" r="7" fill="#f87171" opacity=".7"/>
  <circle cx="52" cy="28" r="7" fill="#c9934e" opacity=".7"/>
  <circle cx="76" cy="28" r="7" fill="#c28f55" opacity=".8"/>
  <rect x="480" y="16" width="240" height="24" rx="12" fill="#ffffff" opacity=".06"/>
  <text x="600" y="32" font-family="monospace" font-size="12" fill="#9ca3af" text-anchor="middle">invoice-processing · GPT-4o + n8n</text>

  <!-- invoice document -->
  <g font-family="sans-serif">
    <rect x="110" y="110" width="420" height="540" rx="16" fill="#1a1c1e" stroke="#ffffff" stroke-opacity=".1"/>
    <text x="146" y="164" font-weight="bold" font-size="22" fill="#f1f5f9">INVOICE</text>
    <text x="146" y="190" font-size="12" fill="#6b7280">#INV-2026-0341</text>
    <line x1="146" y1="212" x2="494" y2="212" stroke="#ffffff" stroke-opacity=".08"/>
    <text x="146" y="248" font-size="11" fill="#6b7280">FROM</text><text x="146" y="268" font-size="13" fill="#cbd5e1">Nordic Design AB</text>
    <text x="146" y="316" font-size="11" fill="#6b7280">BILL TO</text><text x="146" y="336" font-size="13" fill="#cbd5e1">Fern &amp; Co Ltd</text>
    <!-- line items table -->
    <rect x="146" y="366" width="348" height="30" rx="6" fill="#ffffff" fill-opacity=".05"/>
    <text x="158" y="386" font-size="10.5" fill="#9ca3af">ITEM</text><text x="392" y="386" font-size="10.5" fill="#9ca3af">AMOUNT</text>
    <text x="158" y="420" font-size="12" fill="#cbd5e1">Brand identity design</text><text x="492" y="420" font-size="12" fill="#cbd5e1" text-anchor="end">$2,400.00</text>
    <text x="158" y="450" font-size="12" fill="#cbd5e1">Website wireframes ×8</text><text x="492" y="450" font-size="12" fill="#cbd5e1" text-anchor="end">$1,600.00</text>
    <text x="158" y="480" font-size="12" fill="#cbd5e1">Design system tokens</text><text x="492" y="480" font-size="12" fill="#cbd5e1" text-anchor="end">$900.00</text>
    <line x1="146" y1="504" x2="494" y2="504" stroke="#ffffff" stroke-opacity=".08"/>
    <text x="158" y="532" font-size="12" fill="#9ca3af">TOTAL (extracted ✓)</text><text x="492" y="532" font-size="14" font-weight="bold" fill="#c28f55" text-anchor="end">$4,900.00</text>
    <rect x="146" y="556" width="150 " height="28" rx="14" fill="#352a1a"/><text x="221" y="574" font-size="11" fill="#e5d2af" text-anchor="middle">PDF parsed in 3.1s</text>
    <!-- scan effect -->
    <rect x="110" y="110" width="420" height="4" fill="#c28f55" opacity=".8"><animate attributeName="y" values="112;646;112" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;.15;.7" dur="5s" repeatCount="indefinite"/></rect>
  </g>

  <!-- extraction panel -->
  <g font-family="sans-serif" font-size="12">
    <rect x="580" y="110" width="500" height="330" rx="20" fill="#171412" stroke="#ffffff" stroke-opacity=".09"/>
    <text x="608" y="146" font-size="11" fill="#6b7280" letter-spacing="1.5">AI EXTRACTION — STRUCTURED JSON</text>
    <g font-family="monospace" font-size="12.5">
      <text x="608" y="182" fill="#6b7280">{</text>
      <text x="628" y="206" fill="#9ca3af">"vendor":</text><text x="726" y="206" fill="#d3b084">"Nordic Design AB"</text><text x="918" y="206" fill="#c28f55">✓</text>
      <text x="628" y="230" fill="#9ca3af">"invoice_no":</text><text x="742" y="230" fill="#d3b084">"INV-2026-0341"</text><text x="902" y="230" fill="#c28f55">✓</text>
      <text x="628" y="254" fill="#9ca3af">"due_date":</text><text x="730" y="254" fill="#d3b084">"2026-09-14"</text><text x="854" y="254" fill="#c28f55">✓</text>
      <text x="628" y="278" fill="#9ca3af">"total":</text><text x="702" y="278" fill="#d3b084">4900.00, "currency":</text><text x="886" y="278" fill="#d3b084">"USD"</text>
      <text x="628" y="302" fill="#9ca3af">"line_items":</text><text x="748" y="302" fill="#e2e8f0">[3 items]</text><text x="838" y="302" fill="#c28f55">✓</text>
      <text x="628" y="326" fill="#9ca3af">"po_match":</text><text x="744" y="326" fill="#c9934e">"PO-1187"</text>
      <text x="628" y="350" fill="#9ca3af">"validation":</text><text x="754" y="350" fill="#c28f55">"sum = total ✓ PO match ✓"</text>
      <text x="608" y="374" fill="#6b7280">}</text>
    </g>
    <rect x="608" y="394" width="200" height="30" rx="15" fill="#352a1a"/>
    <text x="708" y="413" fill="#e5d2af" text-anchor="middle" font-weight="bold">✓ AUTO-APPROVED</text>
    <text x="830" y="413" fill="#6b7280" font-size="11">→ posting to Xero…</text>
  </g>

  <!-- pipeline -->
  <g font-family="sans-serif" font-size="12.5">
    <rect x="580" y="470" width="500" height="240" rx="20" fill="#171412" stroke="#ffffff" stroke-opacity=".09"/>
    <text x="608" y="506" font-size="11" fill="#6b7280" letter-spacing="1.5">PROCESSING PIPELINE — THIS WEEK</text>
    <g transform="translate(608,530)">
      <rect width="104" height="64" rx="12" fill="#2b2114" stroke="#c28f55" stroke-opacity=".35"/>
      <text x="52" y="27" fill="#e2ccad" text-anchor="middle" font-weight="bold">42</text><text x="52" y="47" fill="#d3b084" font-size="10" text-anchor="middle">received</text>
      <path d="M108 32 h20" stroke="#c28f55" stroke-dasharray="5 4"><animate attributeName="stroke-dashoffset" values="9;0" dur=".8s" repeatCount="indefinite"/></path>
      <rect x="132" width="104" height="64" rx="12" fill="#2b2114" stroke="#c28f55" stroke-opacity=".35"/>
      <text x="184" y="27" fill="#e2ccad" text-anchor="middle" font-weight="bold">42</text><text x="184" y="47" fill="#d3b084" font-size="10" text-anchor="middle">extracted</text>
      <path d="M240 32 h20" stroke="#c28f55" stroke-dasharray="5 4"><animate attributeName="stroke-dashoffset" values="9;0" dur=".8s" begin=".2s" repeatCount="indefinite"/></path>
      <rect x="264" width="104" height="64" rx="12" fill="#33281a" stroke="#c29a60" stroke-opacity=".4"/>
      <text x="316" y="27" fill="#e5d2af" text-anchor="middle" font-weight="bold">38</text><text x="316" y="47" fill="#e5d2af" font-size="10" text-anchor="middle">auto-posted</text>
      <path d="M372 32 h20" stroke="#c29a60" stroke-dasharray="5 4"><animate attributeName="stroke-dashoffset" values="9;0" dur=".8s" begin=".4s" repeatCount="indefinite"/></path>
      <rect x="396" width="80" height="64" rx="12" fill="#292524" stroke="#c9934e" stroke-opacity=".45"/>
      <text x="436" y="27" fill="#e5d2af" text-anchor="middle" font-weight="bold">4</text><text x="436" y="47" fill="#e5d2af" font-size="10" text-anchor="middle">review</text>
    </g>
    <text x="608" y="668" fill="#9ca3af">Manual entry time: ~15 min/invoice → now exceptions only (&lt;1 min each)</text>
    <text x="608" y="690" fill="#c28f55">✓ Xero synced · ✓ Drive archived · ✓ Audit trail logged</text>
  </g>
  <rect width="1200" height="750" fill="url(#inv)" opacity=".05"/>
</svg>
